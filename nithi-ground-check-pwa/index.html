<title>Nithi Ground Check</title>
<style>
/* Layout: one-column field tool, bottom tab bar, big tap targets, numbers in mono. */
:root{

  --accent:#0b5d73; --accent-ink:#ffffff; --field:#ffffff;
  --ok:#1b7447; --okbg:#dff1e6; --bad:#b3261e; --badbg:#fbe3e0; --warn:#8a5a00; --warnbg:#faefcf;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#1a212a; --ink:#e6eaf0; --muted:#97a2b0; --line:#2b3440;
  --accent:#5cc0d8; --accent-ink:#06212a; --field:#0f141a;
  --ok:#6fd49b; --okbg:#173326; --bad:#ff8a80; --badbg:#3a1d1b; --warn:#f0c15a; --warnbg:#392d12; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#1a212a; --ink:#e6eaf0; --muted:#97a2b0; --line:#2b3440;
  --accent:#5cc0d8; --accent-ink:#06212a; --field:#0f141a;
  --ok:#6fd49b; --okbg:#173326; --bad:#ff8a80; --badbg:#3a1d1b; --warn:#f0c15a; --warnbg:#392d12; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;
  padding-block:14px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-size:20px;margin:0;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12.5px}
.badge{font-size:11.5px;padding:3px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
label,.lab{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
select,input,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px}
input.num{font-family:var(--mono)}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg.one{grid-template-columns:1fr}
.seg button{min-height:42px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;font:inherit;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;min-width:48px;padding:0 10px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;font:inherit;font-family:var(--mono);font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chip.done::after{content:" ✓";color:var(--ok)}
.chip[aria-pressed="true"].done::after{color:var(--accent-ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);text-align:right;overflow-wrap:anywhere}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3>div{min-width:0;display:flex;flex-direction:column;gap:4px}
.btn{min-height:46px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;font-size:15px;padding:0 16px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.bad{background:var(--badbg);color:var(--bad)} .pill.warn{background:var(--warnbg);color:var(--warn)} .pill.none{background:var(--field);color:var(--muted);border:1px solid var(--line)}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:9px 11px;font-size:13.5px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res .cell{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.res .cell b{display:block;font-family:var(--mono);font-size:19px;font-weight:500}
.res .cell span{font-size:11.5px;color:var(--muted)}
.res .cell.bad b{color:var(--bad)} .res .cell.ok b{color:var(--ok)}
.hint{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.logrow{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.logrow:first-child{border-top:0;padding-top:0}
.mono{font-family:var(--mono)} .tiny{font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--mono)} th{font-weight:500;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
tr.tap{cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:5}
nav button{min-height:48px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:500;border-radius:8px}
nav button[aria-current="page"]{color:var(--accent);font-weight:600;background:var(--field)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
textarea.csv{font-family:var(--mono);font-size:12px;min-height:140px}
@media (prefers-reduced-motion:no-preference){.pill{transition:background .15s}}
</style>

function elementsFor(s){

//CALC-START
function compare(d,m,tolMm){
  const r={dE:null,dN:null,rad:null,u:null,v:null,dZ:null,okH:null,okZ:null,status:'none'};
  if(m.E!=null&&m.N!=null&&d.E!=null&&d.N!=null){
    r.dE=m.E-d.E; r.dN=m.N-d.N; r.rad=Math.hypot(r.dE,r.dN);
    r.u=r.dE*UX+r.dN*UY; r.v=r.dE*VX+r.dN*VY; r.okH=r.rad*1000<=tolMm.h;
  }
  if(m.Z!=null&&d.Z!=null){ r.dZ=m.Z-d.Z; r.okZ=Math.abs(r.dZ)*1000<=tolMm.z; }
  const flags=[r.okH,r.okZ].filter(x=>x!==null);
  r.status=!flags.length?'none':flags.every(Boolean)?'ok':'bad';
  return r;
}
//CALC-END

async function initStore(){

  render();
}
function addReading(r){
  readings.unshift(r); sortR();
  if(store.mode==='db') store.col.doc(r.id).set(r).catch(()=>{store.mode='local';setBadge();saveLS('nithi_readings',readings)});
  else saveLS('nithi_readings',readings);
}
function delReading(id){
  readings=readings.filter(r=>r.id!==id);
  if(store.mode==='db') store.col.doc(id).delete().catch(()=>{}); else saveLS('nithi_readings',readings);
}
function clearReadings(){ const ids=readings.map(r=>r.id); readings=[]; if(store.mode==='db') ids.forEach(id=>store.col.doc(id).delete().catch(()=>{})); else saveLS('nithi_readings',[]); }

/* ---------- state ---------- */
const S={tab:'check',sKey:'P4',el:'pile',pt:'PL1',logFilter:'all',confirmClear:false,csv:null,expanded:null};
const curStruct=()=>structures.find(s=>s.key===S.sKey);

const parseNum=v=>{const t=String(v).trim().replace(',','.'); if(t==='')return null; const n=parseFloat(t); return isFinite(n)?n:null};
const loggedIds=()=>new Set(readings.filter(r=>r.sKey===S.sKey&&r.el===S.el).map(r=>r.pt));

function pileLevelRows(s,pt){
  const piles=s.pier?s.pier.piles:s.abut.piles, q=piles.find(x=>x.id===pt.id); if(!q) return '';
  const r=pileRecord(s,q);
  return `<dt>Book name</dt><dd>${r.no}</dd><dt>Design pile length</dt><dd>${r.len!=null?r.len.toFixed(2)+' m':'—'}</dd><dt>Design pile toe level</dt><dd>${r.toe!=null?f3(r.toe):'—'}</dd>`;
}
function casingCalc(s,pt){
  const q=(s.pier?s.pier.piles:s.abut.piles).find(x=>x.id===pt.id); if(!q) return null;
  const r=pileRecord(s,q), v=(REC_VAL['rec_'+s.key+'_'+q.id]||{}).casing, c=parseNum(v==null?'':v);
  return {r,key:'rec_'+s.key+'_'+q.id,raw:v||'',c};
}
function casingHtml(s,pt){
  const k=casingCalc(s,pt); if(!k) return '';
  const {r,c}=k, ok=c!=null&&!isNaN(c);
  return `<div class="lab">Casing</div><div><label for="cas">Casing top level (m)</label><input class="num" id="cas" inputmode="decimal" autocomplete="off" placeholder="12…" value="${esc(k.raw)}"></div><dl class="kv" id="casout">${casingOut(r,c,ok)}</dl>`;
}
function casingOut(r,c,ok){
  return `<dt>Casing top to pile head</dt><dd>${ok&&r.head!=null?(c-r.head).toFixed(3)+' m':'—'}</dd><dt>Casing top to pile toe</dt><dd>${ok&&r.toe!=null?(c-r.toe).toFixed(3)+' m':'—'}</dd>`;
}
function wireCasing(s,pt){
  const el=$('#cas'); if(!el) return;
  el.oninput=()=>{const k=casingCalc(s,pt), key=k.key; REC_VAL[key]=Object.assign(REC_VAL[key]||{},{casing:el.value}); saveLS('nithi_rec',REC_VAL);
    const c=parseNum(el.value); $('#casout').innerHTML=casingOut(k.r,c,c!=null&&!isNaN(c));};
}

function readInputs(){return {E:parseNum($('#mE').value),N:parseNum($('#mN').value),Z:parseNum($('#mZ').value)}}
function updateResult(){
  const {e,p}=curElement(), m=readInputs();
  const r=compare(p,m,{h:tol[e.tolKey],z:tol.level});
  const el=$('#result');

  $('#save').disabled=!anyIn;
  if(!anyIn){el.innerHTML='<div class="hint">Enter a reading to see the difference. Differences are ground minus design.</div>';return}
  const partialH=(m.E!=null)!==(m.N!=null);
  const pill=r.status==='ok'?'<span class="pill ok">Within tolerance</span>':r.status==='bad'?'<span class="pill bad">Out of tolerance</span>':'<span class="pill none">Need Easting and Northing</span>';
  el.innerHTML=`<div class="row" style="margin-bottom:8px">${pill}<span class="tiny">tolerance ${p.E!=null?'±'+tol[e.tolKey]+' mm position':''}${p.E!=null&&p.Z!=null?' · ':''}${p.Z!=null?'±'+tol.level+' mm level':''}</span></div>
  <div class="res">
    ${r.rad!=null?`<div class="cell ${r.okH?'ok':'bad'}"><b>${Math.round(r.rad*1000)} mm</b><span>Horizontal offset</span></div>`:''}
    ${r.dZ!=null?`<div class="cell ${r.okZ?'ok':'bad'}"><b>${mm(r.dZ)}</b><span>Level, ground − design</span></div>`:''}

  </div>${partialH?'<div class="hint" style="margin-top:6px">Add both Easting and Northing to get the horizontal offset.</div>':''}`;
}
function saveReading(){
  const s=curStruct(), {e,p}=curElement(), m=readInputs();
  const r=compare(p,m,{h:tol[e.tolKey],z:tol.level});
  const rec={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:new Date().toISOString(),sKey:S.sKey,struct:s.label,el:S.el,elName:e.name,pt:p.id,
    mE:m.E,mN:m.N,mZ:m.Z,dE:p.E,dN:p.N,dZ:p.Z,eE:r.dE,eN:r.dN,rad:r.rad,across:r.u,along:r.v,eZ:r.dZ,status:r.status,note:$('#note').value.trim()};

let BP_VAL=loadLS('nithi_bp',{});
const bnum=x=>{const n=parseNum(x==null?'':String(x));return (n==null||isNaN(n))?null:n};
function bpBars(dia,key){const x=REINF[key];if(!x)return {bars:'',links:''};return {bars:x[0]+'T25 equally spaced',links:'T10 @ 175 outer ring ('+x[1]+' no.); T25 @ 2000 inner ring ('+x[2]+' no.)'}}
function recSwitch(){return `<section class="card"><div class="seg" id="recsw" style="grid-template-columns:1fr 1fr"><button data-rf="hand" aria-pressed="${S.recForm!=='bored'}">Hand-dug record</button><button data-rf="bored" aria-pressed="${S.recForm==='bored'}">Bored pile record</button></div></section>`}

function bpCalc(r,q,v){
  const g=x=>(v[x]!=null&&v[x]!=='')?v[x]:'';
  const ground=bnum(g('ground')), cut=bnum(g('cutoff')!==''?g('cutoff'):(r.head!=null?r.head:'')), toe=bnum(g('toe'));
  const pen=(ground!=null&&toe!=null)?ground-toe:null, hole=(cut!=null&&toe!=null)?cut-toe:null;
  const dv=r.len!=null?Math.PI*Math.pow(q.dia/2000,2)*r.len:null, mv=bnum(g('vol'));

}
function bpCalcHtml(r,q,v){

}

function bpCsv(){

    const has=Object.keys(v).some(k=>k!=='upd'&&k!=='log'&&v[k]!=='')||(v.log||[]).some(x=>x.d||x.t); if(!has) return;
    const r=pileRecord(s,p), c=bpCalc(r,p,v), g=x=>v[x]!=null?v[x]:'', b=bpBars(p.dia,s.key);
    rows.push([r.no,p.dia,g('casting'),g('ground'),g('cutoff')!==''?g('cutoff'):(r.head!=null?r.head.toFixed(3):''),g('toe'),c.pen!=null?c.pen.toFixed(3):'',c.hole!=null?c.hole.toFixed(3):'',g('bstart'),g('bend'),g('csize'),g('clen'),g('bars')!==''?g('bars'):b.bars,g('cage'),g('links')!==''?g('links'):b.links,g('meth'),g('grade')!==''?g('grade'):'C25/30',g('vol'),c.dv!=null?c.dv.toFixed(2):'',g('cubes'),g('cuberef'),g('cwy'),g('sup'),(v.log||[]).filter(x=>x.d||x.t).map(x=>(x.d||'')+' m: '+(x.t||'')).join('; '),g('comments'),g('prep'),g('prepD'),g('hhea'),g('hheaD'),g('kenha'),g('kenhaD')]);
  });});
  return rows.map(r=>r.map(q).join(',')).join('\n');
}
async function exportBP(){
  const text=bpCsv();
  try{
    const url=URL.createObjectURL(new Blob([text],{type:'text/csv'}));
    const a=document.createElement('a'); a.href=url; a.download='nithi-bored-pile-records-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){ S.bcsv=text; render(); }
}
function renderBored(){
  const s=curStruct(), piles=s.pier?s.pier.piles:s.abut.piles;
  if(!S.recPile||!piles.find(x=>x.id===S.recPile)) S.recPile=piles[0].id;
  const q=piles.find(x=>x.id===S.recPile), r=pileRecord(s,q), bb=bpBars(q.dia,s.key);
  const names=piles.map(x=>({id:x.id,n:bookPileName(s,x)})).sort((a,b)=>a.n.localeCompare(b.n,undefined,{numeric:true}));
  const key='bp_'+s.key+'_'+q.id; if(!BP_VAL[key]) BP_VAL[key]={}; const v=BP_VAL[key];
  if(!v.log||!v.log.length) v.log=[{d:'',t:''},{d:'',t:''},{d:'',t:''},{d:'',t:''},{d:'',t:''},{d:'',t:''}];
  const val=(id,def)=>(v[id]!=null&&v[id]!=='')?v[id]:(def==null?'':def);
  const fld=(id,lab,def,type,ph)=>`<div><label for="${id}">${lab}</label><input id="${id}" data-b="${id}" ${type?'type="'+type+'"':'inputmode="text"'} value="${esc(val(id,def))}" placeholder="${ph||''}" autocomplete="off"></div>`;
  const nf=(id,lab,def,ph)=>`<div><label for="${id}">${lab}</label><input id="${id}" data-b="${id}" inputmode="decimal" value="${esc(val(id,def))}" placeholder="${ph||''}" autocomplete="off"></div>`;
  const warn=[]; if(s.pier&&s.pier.gradeFlag==='CHECK') warn.push('Level under query for this pier (see Design tab): confirm the base level, and so the cut-off and toe levels, with the engineer before finishing the pile.');
  if(s.pier&&s.pier.rev) warn.push('Base level revised by the designer ('+s.pier.rev.date+'): was '+s.pier.rev.old.toFixed(3)+', now '+s.pier.level.toFixed(3)+'. Not yet on an issued drawing. The design cut-off and toe levels below use the revised level.');
  if(r.head==null) warn.push('Cut-off level for abutments is not given in the book. Take it from the pile cap bottom level on the abutment sheets.');
  $('#view').innerHTML=`${recSwitch()}
  <section class="card"><div class="row"><div style="flex:1"><label for="rs">Pier or abutment</label><select id="rs">${structures.map(x=>`<option value="${x.key}"${x.key===S.sKey?' selected':''}>${esc(x.label)}</option>`).join('')}</select></div>
  <div style="flex:1"><label for="rp">Pile</label><select id="rp">${names.map(x=>`<option value="${x.id}"${x.id===S.recPile?' selected':''}>${x.n}</option>`).join('')}</select></div></div></section>
  ${warn.map(w=>`<div class="warnbox">${esc(w)}</div>`).join('')}
  <section class="card"><b>BORED PILE RECORD: header</b><div class="hint">Filled from the book of drawings.</div>
  <dl class="kv"><dt>Project Title</dt><dd>${esc(FORM_PROJECT)}</dd><dt>Proj. Ref. No.</dt><dd>6000104</dd><dt>Pile Ref No.</dt><dd>${r.no}</dd><dt>Pile Size</dt><dd>${q.dia} mm</dd>
  <dt>Design cut-off level</dt><dd>${r.head!=null?r.head.toFixed(3)+' m':'—'}</dd><dt>Design toe level</dt><dd>${r.toe!=null?r.toe.toFixed(3)+' m':'—'}</dd><dt>Design pile length</dt><dd>${r.len!=null?r.len+' m':'—'}</dd></dl>
  ${fld('casting','Time &amp; date of casting','', 'datetime-local')}</section>
  <section class="card"><b>Boring details</b>
  ${nf('ground','Ground level (m)','','e.g. 1233.5')}${nf('cutoff','Cut-off level (m)',r.head!=null?r.head.toFixed(3):'','design value filled in; change if told')}${nf('toe','Toe level (m), as built','', r.toe!=null?'design '+r.toe.toFixed(3):'')}
  <dl class="kv" id="bpcalc">${bpCalcHtml(r,q,v)}</dl>
  ${fld('bstart','Date &amp; time boring started','','datetime-local')}${fld('bend','Date &amp; time boring ended','','datetime-local')}</section>
  <section class="card"><b>Bore pile detail</b>
  <div class="lab">Steel casing</div>${nf('csize','Size (mm) diameter','','')}${nf('clen','Length (m)','','')}
  <div class="hint">No steel casing size or length is given in the pile sheets, the notes or the pile design table in the book. Take them from the method statement or the engineer.</div>
  <div class="lab">Reinforcement</div>${fld('bars','No. / bar size (mm)',bb.bars,null,'')}${nf('cage','Length (m)',r.len!=null?r.len.toFixed(1):'','')}${fld('links','Link size / spacing (mm)',bb.links,null,'')}
  <div class="hint">Read from pile reinforcement sheet ${sheetNo(s.key)} of the book: main bars per pile, outer T10 rings and inner T25 stiffener rings, with the pile length from sheet 56. The cage runs into the pile cap by the anchorage shown on the sheet. The sheets still show the base levels from before the designer's revision.</div>
  <div class="lab">Concreting</div>
  <div><label for="meth">Concreting method</label><select id="meth" data-b="meth">${['','Dry','Tremie'].map(o=>`<option value="${o}"${val('meth')===o?' selected':''}>${o||'Select'}</option>`).join('')}</select></div>
  ${fld('grade','Concrete grade (N/mm²)','C25/30',null,'')}${nf('vol','Vol. of concrete cast (m³)','','')}${nf('cubes','No. of cubes taken','','')}${fld('cuberef','Test cube ref. no.','',null,'')}</section>
  <section class="card"><b>Bore log</b><div class="hint">Depth (m) and soil description, top to bottom.</div>
  ${v.log.map((x,i)=>`<div class="row"><input data-lg="d" data-i="${i}" inputmode="decimal" placeholder="Depth (m)" value="${esc(x.d)}" style="flex:0 0 100px" aria-label="Depth ${i+1}"><input data-lg="t" data-i="${i}" placeholder="Soil description" value="${esc(x.t)}" aria-label="Soil ${i+1}"></div>`).join('')}
  <button class="btn ghost" id="bpadd">Add a row</button></section>
  <section class="card"><b>Inspection and comments</b>
  ${fld('cwy','CWY site rep','',null,'')}${fld('sup','Site supervisor','',null,'')}
  <div><label for="comments">Comments</label><textarea id="comments" data-b="comments" rows="3">${esc(val('comments'))}</textarea></div></section>
  <section class="card"><b>Sign-off</b><div class="hint">Names and dates only. Signatures stay on the paper form.</div>
  ${fld('prep','Prepared by (CWY site rep)','',null,'')}${fld('prepD','Date','','date')}${fld('hhea','Confirmed by (HHEA Ltd)','',null,'')}${fld('hheaD','Date','','date')}${fld('kenha','Confirmed by (KeNHA site rep)','',null,'')}${fld('kenhaD','Date','','date')}</section>
  <section class="card"><b>Copy or export</b>
  <button class="btn ghost" id="bpcp">Copy this record as text</button><div class="hint" id="bpmsg"></div>
  <button class="btn" id="bpexp" style="margin-top:8px">Export all bored pile records (CSV)</button>
  ${S.bcsv?`<textarea class="csv" readonly>${esc(S.bcsv)}</textarea><div class="hint">Copy this into a file named .csv</div>`:''}</section>`;
  wireSwitch();
  $('#rs').onchange=e=>{S.sKey=e.target.value;S.recPile=null;render()};
  $('#rp').onchange=e=>{S.recPile=e.target.value;render()};
  const stamp=()=>{v.upd=new Date().toISOString().slice(0,10);saveLS('nithi_bp',BP_VAL)};
  const onchg=e=>{const t=e.target;
    if(t.dataset.b){v[t.dataset.b]=t.value;stamp();$('#bpcalc').innerHTML=bpCalcHtml(r,q,v)}
    else if(t.dataset.lg){const i=+t.dataset.i;v.log[i][t.dataset.lg]=t.value;stamp()}};
  $('#view').oninput=onchg; $('#view').onchange=onchg;
  $('#bpadd').onclick=()=>{v.log.push({d:'',t:''});stamp();render()};
  $('#bpexp').onclick=exportBP;
  $('#bpcp').onclick=async()=>{try{await navigator.clipboard.writeText(bpText(s,q,r,v));$('#bpmsg').textContent='Copied.'}catch(e){$('#bpmsg').textContent='Copy not allowed here.'}};
}
function renderRecord(){ if(S.recForm==='bored') renderBored(); else renderHand(); }

/* ---------- SETTINGS ---------- */
function renderSettings(){
  $('#view').innerHTML=`<section class="card"><b>Tolerances (mm)</b>
    <div class="hint">Starting values only. Set them to your specification before relying on pass or fail.</div>
    ${[['pile','Pile position (centre)'],['shaft','Shaft corner position'],['centre','Pier centre position'],['level','Level (all elements)']].map(([k,l])=>`<div><label for="t_${k}">${l}</label><input class="num" id="t_${k}" inputmode="numeric" value="${tol[k]}"></div>`).join('')}
    <button class="btn" id="tsave">Save tolerances</button></section>
  <section class="card"><b>Readings</b><div class="hint">Readings are kept on this phone only. Export a CSV regularly: clearing the browser site data or uninstalling the app removes them.</div>
    <button class="btn ${S.confirmClear?'danger':'ghost'}" id="clr" ${readings.length?'':'disabled'}>${S.confirmClear?'Tap again to delete all '+readings.length+' readings':'Delete all readings'}</button></section>
  <section class="card"><b>About the design data</b><div class="hint">Coordinates come from the Nithi setting-out DWG and the pier dimension workbook. Pile head and column top levels are calculated from the elevation sheets and the base thickness, not read from a pile drawing. Piers 5, 8, 10 and 11 use the designer's revised base levels of 19 Nov 2026 (not yet on an issued drawing). Piers 5 and 8 are still under query; Piers 3, 13 and 18 are waiting on the designer's answer on the bearing allowance.</div></section>`;
  $('#tsave').onclick=()=>{['pile','shaft','centre','level'].forEach(k=>{const v=parseNum($('#t_'+k).value);if(v!=null&&v>=0)tol[k]=v});saveLS('nithi_tol',tol);$('#tsave').textContent='Saved'};
  $('#clr').onclick=()=>{if(S.confirmClear){clearReadings();S.confirmClear=false}else S.confirmClear=true;render()};
}

function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===S.tab?'page':'false'));
  $('#view').onclick=null;
  ({check:renderCheck,log:renderLog,design:renderDesign,record:renderRecord,settings:renderSettings})[S.tab]();
}
$('#tabs').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;S.tab=b.dataset.tab;S.confirmClear=false;S.expanded=null;render();window.scrollTo(0,0)};
render(); initStore();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{offlineReady=true;setBadge()}).catch(()=>{});
}
