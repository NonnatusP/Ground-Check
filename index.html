<style>
/* Layout: one-column field tool, bottom tab bar, big tap targets, numbers in mono. */
:root{
  --bg:#f2f3ef; --surface:#ffffff; --ink:#1a2330; --muted:#5b6675; --line:#d8dcd3;
  --accent:#0b5d73; --accent-ink:#ffffff; --field:#ffffff;
  --ok:#1b7447; --okbg:#dff1e6; --bad:#b3261e; --badbg:#fbe3e0; --warn:#8a5a00; --warnbg:#faefcf;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#1a212a; --ink:#e6eaf0; --muted:#97a2b0; --line:#2b3440;
  --accent:#5cc0d8; --accent-ink:#06212a; --field:#0f141a;
  --ok:#6fd49b; --okbg:#173326; --bad:#ff8a80; --badbg:#3a1d1b; --warn:#f0c15a; --warnbg:#392d12; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#1a212a; --ink:#e6eaf0; --muted:#97a2b0; --line:#2b3440;
  --accent:#5cc0d8; --accent-ink:#06212a; --field:#0f141a;
  --ok:#6fd49b; --okbg:#173326; --bad:#ff8a80; --badbg:#3a1d1b; --warn:#f0c15a; --warnbg:#392d12; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;
  padding-block:14px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-size:20px;margin:0;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12.5px}
.badge{font-size:11.5px;padding:3px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
label,.lab{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
select,input,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px}
input.num{font-family:var(--mono)}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg.one{grid-template-columns:1fr}
.seg button{min-height:42px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;font:inherit;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;min-width:48px;padding:0 10px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;font:inherit;font-family:var(--mono);font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chip.done::after{content:" ✓";color:var(--ok)}
.chip[aria-pressed="true"].done::after{color:var(--accent-ink)}
.kv{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);text-align:right;overflow-wrap:anywhere}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3>div{min-width:0;display:flex;flex-direction:column;gap:4px}
.btn{min-height:46px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;font-size:15px;padding:0 16px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.bad{background:var(--badbg);color:var(--bad)} .pill.warn{background:var(--warnbg);color:var(--warn)} .pill.none{background:var(--field);color:var(--muted);border:1px solid var(--line)}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:9px 11px;font-size:13.5px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res .cell{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.res .cell b{display:block;font-family:var(--mono);font-size:19px;font-weight:500}
.res .cell span{font-size:11.5px;color:var(--muted)}
.res .cell.bad b{color:var(--bad)} .res .cell.ok b{color:var(--ok)}
.hint{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.logrow{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.logrow:first-child{border-top:0;padding-top:0}
.mono{font-family:var(--mono)} .tiny{font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--mono)} th{font-weight:500;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
tr.tap{cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:5}
nav button{min-height:48px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:500;border-radius:8px}
nav button[aria-current="page"]{color:var(--accent);font-weight:600;background:var(--field)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
textarea.csv{font-family:var(--mono);font-size:12px;min-height:140px}
@media (prefers-reduced-motion:no-preference){.pill{transition:background .15s}}
:root{--peg:#f2a33a;--peg-ink:#1f1400;--info:#2b6cb0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--info:#7db4ee}}
:root[data-theme="dark"]{--info:#7db4ee}
header{align-items:center}
header h1{font-size:16px}
/* where-am-I bar */
.loc{position:sticky;top:0;z-index:4;background:var(--bg);margin:-6px -16px 0;padding:8px 16px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.loc[hidden]{display:none}
.locrow{display:flex;gap:8px;align-items:stretch}
.step{flex:0 0 48px;min-height:56px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font-size:26px;line-height:1}
.step:disabled{opacity:.3}
.where{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:56px;padding:0 12px 0 0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font:inherit;text-align:left;overflow:hidden}
.where .tag{flex:0 0 58px;align-self:stretch;display:flex;align-items:center;justify-content:center;background:var(--peg);color:var(--peg-ink);font-family:var(--mono);font-weight:500;font-size:26px;border-right:2px solid var(--ink)}
.where .wt{flex:1;min-width:0;display:flex;flex-direction:column}
.where .wt b{font-size:17px;font-weight:600;line-height:1.2}
.where .wt i{font-style:normal;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where .tri{display:inline-block;margin-left:8px;border-style:solid;border-width:0 12px 12px 0;border-color:transparent var(--warn) transparent transparent;vertical-align:middle}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.where svg{flex:0 0 18px;color:var(--muted)}
.piles{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scroll-snap-type:x proximity;scrollbar-width:none}
.piles::-webkit-scrollbar{display:none}
.pc{flex:0 0 auto;scroll-snap-align:center;position:relative;min-width:62px;min-height:46px;padding:0 12px 4px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font-family:var(--mono);font-size:14px}
.pc[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.pc::after{content:"";position:absolute;left:8px;right:8px;bottom:4px;height:3px;border-radius:2px;background:transparent}
.pc[data-st="dig"]::after{background:var(--warn)}
.pc[data-st="toe"]::after{background:var(--info)}
.pc[data-st="done"]::after{background:var(--ok)}
.pc[aria-pressed="true"][data-st="dig"]::after{background:var(--peg)}
.pc[aria-pressed="true"][data-st="toe"]::after,.pc[aria-pressed="true"][data-st="done"]::after{background:var(--accent-ink)}
.pc[data-rd="1"]::before{content:"✓";position:absolute;top:2px;right:5px;font-size:11px;color:var(--ok)}
.pc[aria-pressed="true"][data-rd="1"]::before{color:var(--accent-ink)}
.pc .mk{position:absolute;top:2px;left:5px;font-style:normal;font-size:10px;line-height:1;color:var(--muted);font-family:var(--sans);font-weight:600}
.pc[aria-pressed="true"] .mk{color:var(--accent-ink)}
.pkey{font-size:11.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.pkey b{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
/* picker sheet */
.shbk{position:fixed;inset:0;background:rgba(10,16,24,.5);z-index:20}
.shp{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88vh;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;border-top:1px solid var(--line);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.shh{display:flex;justify-content:space-between;align-items:center}
.shh b{font-size:17px}
.x{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font-size:22px;line-height:1}
.shg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sc{position:relative;min-height:54px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font-family:var(--mono);font-size:17px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:4px 0 0;overflow:hidden}
.sc[aria-current="true"]{background:var(--peg);border-color:var(--ink);color:var(--peg-ink)}
.sc .pb{width:70%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.sc .pb i{display:block;height:100%;background:var(--ok)}
.sc .fl{position:absolute;top:0;right:0;border-style:solid;border-width:0 14px 14px 0;border-color:transparent var(--warn) transparent transparent}
.sab{grid-column:1/-1;min-height:54px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:inherit;font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center;padding:0 14px}
.sab span{font-weight:400;font-size:12.5px;color:var(--muted)}
.sab[aria-current="true"]{background:var(--peg);border-color:var(--ink);color:var(--peg-ink)}
.sab[aria-current="true"] span{color:var(--peg-ink)}
.shk{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.shk .tri{display:inline-block;border-style:solid;border-width:0 10px 10px 0;border-color:transparent var(--warn) transparent transparent;vertical-align:middle;margin-right:4px}

details.acc{padding:0;gap:0}
details.acc>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;padding:0 12px;cursor:pointer;font-weight:600}

details.acc>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 2px 0 4px;flex:0 0 auto}

details.acc[open]>summary{border-bottom:1px solid var(--line)}

.btn.sm{min-height:38px;font-size:13.5px;font-weight:500;padding:0 12px}
/* bottom tabs */
nav{grid-template-columns:repeat(5,1fr);gap:2px}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;font-size:12px;position:relative}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{background:transparent;box-shadow:inset 0 3px 0 var(--accent);border-radius:0 0 8px 8px}
nav .n{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--peg);color:var(--peg-ink);font-size:11px;font-weight:600;line-height:18px;text-align:center}
nav .n:empty{display:none}
</style>

</head>

function compare(d,m,tolMm){
  const r={dE:null,dN:null,rad:null,u:null,v:null,dZ:null,okH:null,okZ:null,status:'none'};
  if(m.E!=null&&m.N!=null&&d.E!=null&&d.N!=null){
    r.dE=m.E-d.E; r.dN=m.N-d.N; r.rad=Math.hypot(r.dE,r.dN);
    r.u=r.dE*UX+r.dN*UY; r.v=r.dE*VX+r.dN*VY; r.okH=r.rad*1000<=tolMm.h;
  }
  if(m.Z!=null&&d.Z!=null){ r.dZ=m.Z-d.Z; r.okZ=Math.abs(r.dZ)*1000<=tolMm.z; }
  const flags=[r.okH,r.okZ].filter(x=>x!==null);
  r.status=!flags.length?'none':flags.every(Boolean)?'ok':'bad';
  return r;
}
//CALC-END

/* ---------- storage: Claude db when available, else this phone ---------- */
let readings=[], store={mode:'local',col:null};
function sortR(){readings.sort((a,b)=>b.t.localeCompare(a.t))}
function setBadge(){ $('#store').textContent = (offlineReady?'Offline ready · ':'')+'saved on this phone · v1.19'; }
let offlineReady=false;
async function initStore(){
  readings=loadLS('nithi_readings',[]); sortR(); setBadge();
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  render();
}
function addReading(r){
  readings.unshift(r); sortR();
  if(store.mode==='db') store.col.doc(r.id).set(r).catch(()=>{store.mode='local';setBadge();saveLS('nithi_readings',readings)});
  else saveLS('nithi_readings',readings);
}
function delReading(id){
  readings=readings.filter(r=>r.id!==id);
  if(store.mode==='db') store.col.doc(id).delete().catch(()=>{}); else saveLS('nithi_readings',readings);
}
function clearReadings(){ const ids=readings.map(r=>r.id); readings=[]; if(store.mode==='db') ids.forEach(id=>store.col.doc(id).delete().catch(()=>{})); else saveLS('nithi_readings',[]); }

/* ---------- state ---------- */
const S={tab:'check',sKey:'P4',el:'pile',pt:'PL1',logFilter:'all',confirmClear:false,csv:null,expanded:null};
const curStruct=()=>structures.find(s=>s.key===S.sKey);
function curElement(){ const els=elementsFor(curStruct()); let e=els.find(x=>x.k===S.el); if(!e){e=els[0];S.el=e.k} let p=e.pts.find(x=>x.id===S.pt); if(!p){p=e.pts[0];S.pt=p.id} return {e,p,els}; }
const parseNum=v=>{const t=String(v).replace(/\s+/g,'').replace(',','.'); if(t==='')return null; const n=parseFloat(t); return isFinite(n)?n:null};
const loggedIds=()=>new Set(readings.filter(r=>r.sKey===S.sKey&&r.el===S.el).map(r=>r.pt));

function pileLevelRows(s,pt){
  const piles=s.pier?s.pier.piles:s.abut.piles, q=piles.find(x=>x.id===pt.id); if(!q) return '';
  const r=pileRecord(s,q);
  return `<dt>Book name</dt><dd>${r.no}</dd><dt>Design pile length</dt><dd>${r.len!=null?r.len.toFixed(2)+' m':'—'}</dd><dt>Design pile toe level</dt><dd>${r.toe!=null?f3(r.toe):'—'}</dd>`;
}
function pileCtx(s,pt){const q=pilesOf(s).find(x=>x.id===pt.id); if(!q) return null; return {q,r:pileRecord(s,q),m:getMethod(s,q.id)}}
function topInfo(s,q,m){
  return m==='rig'?{key:'bp_'+s.key+'_'+q.id,store:BP_VAL,ls:'nithi_bp',field:'ctop',lab:'Casing top',name:'Steel casing top level (m)',hint:'Measure the steel casing top level once the casing is set. The depths are from the casing top down to the pile head and the pile toe.'}
              :{key:'rec_'+s.key+'_'+q.id,store:REC_VAL,ls:'nithi_rec',field:'casing',lab:'Lining top',name:'Concrete lining top level (m)',hint:'Measure the concrete lining top level once the lining is cast. The depths are from the lining top down to the pile head and the pile toe.'};
}
function casingHtml(s,pt){
  const c=pileCtx(s,pt); if(!c) return '';
  const chooser=`<div class="lab">Built by</div><div class="seg" id="mth" style="grid-template-columns:1fr 1fr"><button data-m="hand" aria-pressed="${c.m==='hand'}">Hand-dug</button><button data-m="rig" aria-pressed="${c.m==='rig'}">Drilling rig</button></div>`;
  if(!c.m) return chooser+`<div class="hint">Choose how this pile is being built. A hand-dug pile has a concrete lining top. A pile built with a drilling rig has a steel casing top.</div>`;
  const t=topInfo(s,c.q,c.m), raw=(t.store[t.key]||{})[t.field]||'', n=parseNum(raw), ok=n!=null&&!isNaN(n);
  return chooser+`<div><label for="cas">${t.name}</label><input class="num" id="cas" inputmode="decimal" autocomplete="off" placeholder="12…" value="${esc(raw)}"></div><dl class="kv" id="casout">${casingOut(c.r,n,ok,t.lab)}</dl><div class="hint">${t.hint}</div>`;
}
function casingOut(r,c,ok,lab){
  lab=lab||'Lining top';
  return `<dt>${lab} to pile head</dt><dd>${ok&&r.head!=null?(c-r.head).toFixed(3)+' m':'—'}</dd><dt>${lab} to pile toe</dt><dd>${ok&&r.toe!=null?(c-r.toe).toFixed(3)+' m':'—'}</dd>`;
}
function wireCasing(s,pt){
  const c=pileCtx(s,pt); if(!c) return;
  const mb=$('#mth'); if(mb) mb.onclick=e=>{const b=e.target.closest('[data-m]'); if(!b) return; setMethod(s,c.q.id,b.dataset.m); render()};
  const el=$('#cas'); if(!el) return; const t=topInfo(s,c.q,c.m);
  el.oninput=()=>{t.store[t.key]=Object.assign(t.store[t.key]||{},{[t.field]:el.value}); saveLS(t.ls,t.store); const n=parseNum(el.value); $('#casout').innerHTML=casingOut(c.r,n,n!=null&&!isNaN(n),t.lab)};
}

function readInputs(){return {E:parseNum($('#mE').value),N:parseNum($('#mN').value),Z:parseNum($('#mZ').value)}}
function updateResult(){
  const {e,p}=curElement(), m=readInputs();
  const r=compare(p,m,{h:tol[e.tolKey],z:tol.level});
  const el=$('#result');
  const anyIn=m.E!=null||m.N!=null||m.Z!=null;
  $('#save').disabled=!anyIn;
  if(!anyIn){el.innerHTML='<div class="hint">Enter a reading to see the difference. Differences are ground minus design.</div>';return}
  const partialH=(m.E!=null)!==(m.N!=null);
  const pill=r.status==='ok'?'<span class="pill ok">Within tolerance</span>':r.status==='bad'?'<span class="pill bad">Out of tolerance</span>':'<span class="pill none">Need Easting and Northing</span>';
  el.innerHTML=`<div class="row" style="margin-bottom:8px">${pill}<span class="tiny">tolerance ${p.E!=null?'±'+tol[e.tolKey]+' mm position':''}${p.E!=null&&p.Z!=null?' · ':''}${p.Z!=null?'±'+tol.level+' mm level':''}</span></div>
  <div class="res">
    ${r.rad!=null?`<div class="cell ${r.okH?'ok':'bad'}"><b>${Math.round(r.rad*1000)} mm</b><span>Horizontal offset</span></div>`:''}
    ${r.dZ!=null?`<div class="cell ${r.okZ?'ok':'bad'}"><b>${mm(r.dZ)}</b><span>Level, ground − design</span></div>`:''}
    ${r.dE!=null?`<div class="cell"><b>${mm(r.dE)}</b><span>ΔEasting</span></div><div class="cell"><b>${mm(r.dN)}</b><span>ΔNorthing</span></div>
    <div class="cell"><b>${mm(r.u)}</b><span>Across bridge (+ = NE)</span></div><div class="cell"><b>${mm(r.v)}</b><span>Along bridge (+ = towards Abutment A)</span></div>`:''}
  </div>${partialH?'<div class="hint" style="margin-top:6px">Add both Easting and Northing to get the horizontal offset.</div>':''}`;
}
function saveReading(){
  const s=curStruct(), {e,p}=curElement(), m=readInputs();
  const r=compare(p,m,{h:tol[e.tolKey],z:tol.level});
  const rec={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:new Date().toISOString(),sKey:S.sKey,struct:s.label,el:S.el,elName:e.name,pt:p.id,
    mE:m.E,mN:m.N,mZ:m.Z,dE:p.E,dN:p.N,dZ:p.Z,eE:r.dE,eN:r.dN,rad:r.rad,across:r.u,along:r.v,eZ:r.dZ,status:r.status,note:$('#note').value.trim()};
  addReading(rec);
  const pts=S.el==='pile'?pilesSorted(s).map(x=>({id:x.q.id})):e.pts, i=pts.findIndex(x=>x.id===p.id); if(i>=0&&i<pts.length-1) S.pt=pts[i+1].id;
  render(); const sv=$('#save'); if(sv){sv.textContent='Saved. Next point ready';setTimeout(()=>{if($('#save'))$('#save').textContent='Save reading'},1800)}
}

function csvText(rows){
  const H=['time','structure','element','point','meas_E','meas_N','meas_level','design_E','design_N','design_level','dE_mm','dN_mm','offset_mm','across_mm','along_mm','dLevel_mm','status','note'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"', mmv=v=>v==null?'':Math.round(v*1000);
  return [H.join(',')].concat(rows.map(r=>[r.t,r.struct,r.elName,ptNameR(r),r.mE,r.mN,r.mZ,r.dE,r.dN,r.dZ,mmv(r.eE),mmv(r.eN),mmv(r.rad),mmv(r.across),mmv(r.along),mmv(r.eZ),r.status,r.note].map(q).join(','))).join('\n');
}
async function exportCsv(){
  const rows=readings.filter(r=>S.logFilter==='all'||r.sKey===S.logFilter), text=csvText(rows);
  try{
    const url=URL.createObjectURL(new Blob([text],{type:'text/csv'}));
    const a=document.createElement('a'); a.href=url; a.download='nithi-ground-check-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){ S.csv=text; render(); }
}

    <div class="row"><button class="btn ghost" id="exp" style="flex:1" ${rows.length?'':'disabled'}>Export CSV</button></div>

  </section>
  <section class="card">${rows.length?rows.map(r=>`
    <div class="logrow" data-id="${r.id}">
      <div class="row"><b>${esc(r.struct)} · ${esc(r.elName)} ${esc(ptNameR(r))}</b><span class="pill ${r.status==='ok'?'ok':r.status==='bad'?'bad':'none'}">${r.status==='ok'?'Within':r.status==='bad'?'Out':'No result'}</span></div>
      <div class="tiny">${new Date(r.t).toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}</div>
      <div class="mono" style="font-size:13px">${r.rad!=null?'offset '+Math.round(r.rad*1000)+' mm (E '+mm(r.eE)+', N '+mm(r.eN)+')':''}${r.rad!=null&&r.eZ!=null?' · ':''}${r.eZ!=null?'level '+mm(r.eZ):''}</div>
      ${r.note?`<div class="tiny">${esc(r.note)}</div>`:''}
      <div class="row"><span class="tiny mono">E ${f4(r.mE)} · N ${f4(r.mN)} · Z ${f3(r.mZ)}</span>
      ${S.expanded===r.id?`<button class="btn danger" data-del="${r.id}" style="min-height:38px">Delete</button>`:`<button class="btn ghost" data-ask="${r.id}" style="min-height:38px">Delete…</button>`}</div>
    </div>`).join(''):'<div class="hint">No readings yet. Save one from the Check tab and it appears here.</div>'}
  </section>`;
  $('#flt').onchange=ev=>{S.logFilter=ev.target.value;S.csv=null;render()};

  const cp=$('#cp'); if(cp) cp.onclick=async()=>{try{await navigator.clipboard.writeText(S.csv);cp.textContent='Copied'}catch(e){const b=$('#csvbox');b.select();cp.textContent='Selected. Use Copy on your phone'}};

    if(a){S.expanded=a.dataset.ask;render()} else if(d){delReading(d.dataset.del);S.expanded=null;render()}};

/* ---------- PILE RECORD ---------- */
const PILE_LEN={A0:25,B1:null,P1:20,P2:20,P3:25,P4:25,P5:22,P6:25,P7:25,P8:27,P9:27,P10:30,P11:30,P12:30,P13:28,P14:25,P15:27,P16:21,P17:25,P18:20,P19:20,P20:20,P21:25,A1:23.5};
const FORM_PROJECT='Realignment of Nithi Bridge along Embu–Meru (A9) Road';
const FORM_CONTRACTOR='China Wu Yi Co. Ltd (JV with Howard Humphreys (EA) Ltd)';
function bookPileName(s,q){
  if(q&&q.nm) return q.nm;
  const list=(s.pier?s.pier.piles:s.abut.piles).slice();
  const sgn=s.abut&&s.abut.name==='Abutment A'?1:-1;
  list.sort((a,b)=>(Math.round(b.v*100)-Math.round(a.v*100))||sgn*(Math.round(a.u*100)-Math.round(b.u*100)));
  const i=list.findIndex(x=>x.id===q.id)+1;
  const pre=s.pier?'PR'+s.pier.n:(s.abut.name==='Abutment A'?'AA':'AB');
  return pre+'-PL'+i;
}
const REINF={A0:[36,156,15],P1:[56,130,13],P2:[42,115,11],P3:[42,158,15],P4:[56,158,15],P5:[42,140,14],P6:[42,157,15],P7:[42,158,15],P8:[56,169,16],P9:[56,167,16],P10:[56,185,18],P11:[56,184,18],P12:[56,185,18],P13:[56,173,17],P14:[42,155,15],P15:[42,169,16],P16:[42,135,13],P17:[56,157,15],P18:[42,129,13],P19:[56,129,13],P20:[56,129,13],P21:[56,157,15],A1:[36,148,14]};
function sheetNo(key){return key==='A0'?103:key==='A1'?125:103+(+key.slice(1))}
function barsFor(dia,key){
  const x=REINF[key];
  if(x) return {main:x[0]+'T25 equally spaced (sheet '+sheetNo(key)+')',spiral:'T10 @ 175 outer rings ('+x[1]+' no.); T25 @ 2000 inner rings ('+x[2]+' no.)'};
  return {main:'See pile reinforcement sheet',spiral:'See pile reinforcement sheet'};
}
function pileRecord(s,q){
  const key=s.key, len=PILE_LEN[key], isP=!!s.pier;
  const head=isP?+(s.pier.level-s.pier.thk).toFixed(3):null;
  const toe=(head!=null&&len!=null)?+(head-len).toFixed(3):null;
  const b=barsFor(q.dia,key);
  const sheet=isP?(103+s.pier.n):(s.abut.name==='Abutment A'?'103':'125');
  return {
    structure:s.label+(isP?' · base '+s.pier.base+' '+s.pier.baseSize+' m':''),
    no:bookPileName(s,q), dia:q.dia, conc:'C25/30 (bored cast in-situ pile, note 5.3.3)',
    head, len, toe, main:b.main, spiral:b.spiral, cover:'75 mm against natural ground (note 6.2.1)',
    sheet:'Pile reinforcement sheet '+sheet+' (verify)', E:q.E, N:q.N
  };
}
let REC_VAL=loadLS('nithi_rec',{});
function recText(r,extra){
  return ['HAND-DUG PILE CONSTRUCTION RECORD','Project: '+HD_PROJECT,'Contractor: '+HD_CONTRACTOR,'Pile No. on Layout Plan: '+r.no,
  'Pile Diameter: '+r.dia+' mm','Concrete Class: '+r.conc,'Pile Head Level: '+(r.head!=null?f2(r.head)+' m (calculated)':'-'),
  'Design Pile Length: '+(r.len!=null?r.len+' m':'-'),'Pile Toe Level: '+(r.toe!=null?f2(r.toe)+' m (calculated)':'-'),
  'Main Reinforcement: '+r.main,'Spiral / ring bars: '+r.spiral,'Easting/Northing: '+f4(r.E)+' / '+f4(r.N)].join('\n');
}
function progressCsv(){

const bnum=x=>{const n=parseNum(x==null?'':String(x));return (n==null||isNaN(n))?null:n};
function bpBars(dia,key){const x=REINF[key];if(!x)return {bars:'',links:''};return {bars:x[0]+'T25 equally spaced',links:'T10 @ 175 outer ring ('+x[1]+' no.); T25 @ 2000 inner ring ('+x[2]+' no.)'}}

function bpCalc(r,q,v){
  const g=x=>(v[x]!=null&&v[x]!=='')?v[x]:'';

  const pen=(ground!=null&&toe!=null)?ground-toe:null, hole=(cut!=null&&toe!=null)?cut-toe:null;
  const dv=r.len!=null?Math.PI*Math.pow(q.dia/2000,2)*r.len:null, mv=bnum(g('vol'));
  const ratio=(dv&&mv!=null)?mv/dv:null;

}
function bpCalcHtml(r,q,v){

}
function bpText(s,q,r,v){

  'Ground Level: '+f('ground'),'Cut-Off Level: '+(f('cutoff')!=='-'?f('cutoff'):n(c.cut)),'Toe Level: '+f('toe'),'Penetration: '+n(c.pen),'Hole depth: '+n(c.hole),
  'Boring started: '+f('bstart'),'Boring ended: '+f('bend'),'Steel casing size (mm): '+f('csize')+'  length (m): '+f('clen')+'  top level (m): '+f('ctop'),

  'Concreting method: '+f('meth'),'Concrete grade: '+(f('grade')!=='-'?f('grade'):'C25/30'),'Vol. of concrete cast (m3): '+f('vol'),'Design volume (m3): '+(c.dv!=null?c.dv.toFixed(2):'-'),
  'No. of cubes: '+f('cubes'),'Test cube ref: '+f('cuberef'),'Bore log (depth, soil):',lg,'Comments: '+f('comments')].join('\n');
}
function bpCsv(){
  const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const H=['pile_ref','pile_size_mm','casting','ground_level','cutoff_level','toe_level','penetration_m','hole_depth_m','boring_started','boring_ended','casing_size_mm','casing_length_m','casing_top_level_m','bars','cage_length_m','links','method','grade','vol_cast_m3','design_vol_m3','cubes','cube_ref','bore_log','comments'];
  const rows=[H];
  structures.forEach(s=>{(s.pier?s.pier.piles:s.abut.piles).forEach(p=>{
    const v=BP_VAL['bp_'+s.key+'_'+p.id]; if(!v) return;
    const has=Object.keys(v).some(k=>k!=='upd'&&k!=='log'&&v[k]!=='')||(v.log||[]).some(x=>x.d||x.t); if(!has) return;
    const r=pileRecord(s,p), c=bpCalc(r,p,v), g=x=>v[x]!=null?v[x]:'', b=bpBars(p.dia,s.key);
    rows.push([r.no,p.dia,g('casting'),g('ground'),g('cutoff')!==''?g('cutoff'):(r.head!=null?r.head.toFixed(3):''),g('toe'),c.pen!=null?c.pen.toFixed(3):'',c.hole!=null?c.hole.toFixed(3):'',g('bstart'),g('bend'),g('csize'),g('clen'),g('ctop'),g('bars')!==''?g('bars'):b.bars,g('cage'),g('links')!==''?g('links'):b.links,g('meth'),g('grade')!==''?g('grade'):'C25/30',g('vol'),c.dv!=null?c.dv.toFixed(2):'',g('cubes'),g('cuberef'),(v.log||[]).filter(x=>x.d||x.t).map(x=>(x.d||'')+' m: '+(x.t||'')).join('; '),g('comments')]);

    <div class="shk"><span><span class="tri"></span>Pier height changing</span><span>Bar: piles concreted</span></div></div>`;
  sh.hidden=false; sheetFrom=document.activeElement;
  const cur=sh.querySelector('[aria-current="true"]'); if(cur) cur.focus(); if(cur&&cur.scrollIntoView) cur.scrollIntoView({block:'center'});
}
function closeSheet(){const sh=$('#sheet'); if(sh.hidden) return; sh.hidden=true; sh.innerHTML=''; if(sheetFrom&&sheetFrom.focus) try{sheetFrom.focus()}catch(e){}}
$('#sheet').onclick=ev=>{
  if(ev.target.closest('[data-close]')){closeSheet();return}
  const b=ev.target.closest('[data-s]'); if(b){closeSheet(); setStruct(b.dataset.s)}
};
document.addEventListener('keydown',ev=>{if(ev.key==='Escape') closeSheet()});
/* collapsible sections on the record forms */
function accKey(t){return t.replace(/\s+/g,' ').trim()}
function accCount(body){
  let tot=0,fill=0;
  const rows=body.querySelectorAll('[data-st="s"],[data-lg="d"]');
  if(rows.length){rows.forEach(x=>{tot++;if(x.value.trim())fill++});return {tot,fill}}
  body.querySelectorAll('input:not([type=hidden]),select,textarea').forEach(x=>{tot++;if(String(x.value).trim())fill++});
  return {tot,fill};
}
function accUpdate(d){
  const c=d.querySelector('.cnt'), body=d.querySelector('.accbody'); if(!c||!body) return;
  const {tot,fill}=accCount(body); if(!tot){c.textContent='';return}
  c.textContent=fill+' of '+tot; c.classList.toggle('full',fill===tot);
}
function accordionize(){
  const secs=[...document.querySelectorAll('#view > section.card')].filter(x=>x.firstElementChild&&x.firstElementChild.tagName==='B');
  secs.forEach((sec,i)=>{
    if(i===0) return;
    const b=sec.firstElementChild, title=accKey(b.textContent), d=document.createElement('details'), body=document.createElement('div'), sum=document.createElement('summary');
    d.className='card acc'; body.className='accbody';
    while(b.nextSibling) body.appendChild(b.nextSibling);
    sum.innerHTML='<span class="at"></span><span class="cnt"></span>'; sum.firstChild.textContent=title;
    d.append(sum,body); d.dataset.k=title;
    const pref=S.open&&S.open[title]; d.open=pref!=null?!!pref:/^(2\.|Boring details)/.test(title);
    d.addEventListener('toggle',()=>{S.open=S.open||{};S.open[title]=d.open;saveLS('nithi_nav',Object.fromEntries(NAV_KEYS.map(k=>[k,S[k]])));if(d.open) accUpdate(d)});
    sec.replaceWith(d); accUpdate(d);
  });
  const first=document.querySelector('#view > details.acc');
  if(first){
    const bar=document.createElement('div'); bar.className='row';
    const all=[...document.querySelectorAll('#view > details.acc')];
    bar.innerHTML='<span class="tiny">Tap a section to open it</span><button class="btn ghost sm" id="accall"></button>';
    const btn=bar.querySelector('button'), setTxt=()=>{btn.textContent=all.every(x=>x.open)?'Collapse all':'Expand all'};
    setTxt(); btn.onclick=()=>{const o=!all.every(x=>x.open); all.forEach(x=>{x.open=o}); setTxt()};
    all.forEach(x=>x.addEventListener('toggle',setTxt));
    first.before(bar);
  }
}
document.addEventListener('input',()=>{if(S.tab!=='record') return; document.querySelectorAll('#view > details.acc[open]').forEach(accUpdate)});
document.addEventListener('change',()=>{if(S.tab!=='record') return; document.querySelectorAll('#view > details.acc[open]').forEach(accUpdate)});

const NAV_KEYS=['tab','sKey','el','pt','recPile','recForm','logFilter','open'];
try{const nv=loadLS('nithi_nav',null); if(nv&&typeof nv==='object'&&structures.some(x=>x.key===nv.sKey)&&['check','log','design','record','settings'].includes(nv.tab)) NAV_KEYS.forEach(k=>{if(nv[k]!=null)S[k]=nv[k]})}catch(e){}
function render(){
  syncSel();
  saveLS('nithi_nav',Object.fromEntries(NAV_KEYS.map(k=>[k,S[k]])));
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===S.tab?'page':'false'));
  $('#view').onclick=null;
  renderLoc();
  ({check:renderCheck,log:renderLog,design:renderDesign,record:renderRecord,settings:renderSettings})[S.tab]();
  if(S.tab==='record') accordionize();
  const ln=$('#logn'); if(ln) ln.textContent=readings.length?String(readings.length):'';
}
$('#tabs').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;S.tab=b.dataset.tab;S.confirmClear=false;S.expanded=null;render();window.scrollTo(0,0)};
render(); initStore();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{offlineReady=true;setBadge()}).catch(()=>{});
}
</script>
